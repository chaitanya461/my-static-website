<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Static Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">MyWebsite</div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home" class="hero">
            <div class="hero-content">
                <h1>Welcome to My Static Website</h1>
                <p>Deployed using AWS CodePipeline & Elastic Beanstalk</p>
                <button class="cta-button" id="ctaBtn">Click Me!</button>
            </div>
        </section>

        <section id="about" class="content-section">
            <h2>About Us</h2>
            <p>This is a static website deployed automatically through AWS services.</p>
        </section>

        <section id="contact" class="content-section">
            <h2>Contact</h2>
            <p>Email: info@example.com</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 My Static Website. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
